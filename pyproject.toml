[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timeseries-entropy"
version = "0.1.0"
description = "Unbiased Monte-Carlo entropy estimation for quantized filtered Gaussian time series"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.scripts]
timeseries-entropy = "timeseries_entropy.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/timeseries_entropy"]
